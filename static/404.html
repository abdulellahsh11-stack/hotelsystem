<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>الصفحة غير موجودة — ضيوف</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<style>
  :root{--bg:#0f1a17;--fg:#f3f6f4;--gold:#c9a85f;--muted:#9fb0aa}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:24px}
  .card{max-width:520px;text-align:center}
  .code{font-size:96px;font-weight:800;color:var(--gold);line-height:1;margin:0}
  h1{font-size:24px;margin:16px 0 8px}
  p{color:var(--muted);margin:0 0 28px;line-height:1.9}
  .btn{display:inline-block;background:var(--gold);color:#0f1a17;text-decoration:none;
       font-weight:700;padding:12px 28px;border-radius:10px}
  .btn:hover{filter:brightness(1.08)}
</style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>الصفحة التي تبحث عنها غير موجودة</h1>
    <p>ربما نُقل الرابط أو حُذف. عُد إلى الصفحة الرئيسية للمتابعة.</p>
    <a class="btn" href="/">العودة إلى الرئيسية</a>
  </main>
</body>
</html>
